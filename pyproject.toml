[project]
name = "erddapcfg"
version = "0.0.3"
description = "Python program to work with ERDDAP configurations."
readme = "README.md"
authors = [{ name = "Sebastian Plehan", email = "plehan.sebastian@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["jinja2>=3.1.5", "pandas>=2.2.3"]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/PlehanSebastian/erddapcfg"
Repository = "https://github.com/PlehanSebastian/erddapcfg"

[project.scripts]
erddapcfg = "erddapcfg:cli.cli_entry_point"

[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
